const trackerSavesInProgress = new Set();

async function saveNeonWeeklyPlan(c, previousSchedule) {
  if (trackerSavesInProgress.has(c.id)) {
    throw new Error('A weekly plan save is already running.');
  }

  trackerSavesInProgress.add(c.id);

  try {
    const result = await checkNeonClients();

    if (!result || result.unmatched.length !== 0) {
      throw new Error('Unable to verify database clients.');
    }

    const match = result.matches.find(
      item => item.dashboardId === c.id
    );

    if (!match) {
      throw new Error('Database client not found: ' + c.name);
    }

    const path =
      `/db/records/${match.databaseId}/tracker`;

    const records = await api(path);

    if (!Array.isArray(records) || records.length > 1) {
      throw new Error('Unexpected tracker record count.');
    }

    const previous = previousSchedule || {};
    const next = structuredClone(c.sched || {});

    if (records.length === 1) {
      const record = records[0];
      const stored = record.data.weeklySchedule || {};

      // Do not overwrite another person's newer changes.
      if (
        JSON.stringify(stored) !==
        JSON.stringify(previous)
      ) {
        throw new Error(
          'The weekly plan changed in the database. ' +
          'Reload before editing again.'
        );
      }

      const updated = await api(
        `${path}/${record.id}`,
        {
          method: 'PUT',
          body: JSON.stringify({
            expectedData: record.data,
            data: {
              ...record.data,
              weeklySchedule: next
            }
          })
        }
      );

      if (!updated || !updated.id) {
        throw new Error('Database update not confirmed.');
      }

    } else {
      // New plans must start from an empty database schedule.
      if (Object.keys(previous).length > 0) {
        throw new Error(
          'Existing local plan has no database record.'
        );
      }

      const created = await api(path, {
        method: 'POST',
        body: JSON.stringify({
          data: {
            dashboardClientId: c.id,
            weeklySchedule: next
          }
        })
      });

      if (!created || !created.id) {
        throw new Error('Database insert not confirmed.');
      }
    }

    console.log('Weekly plan saved to Neon:', c.name);
    return true;

  } finally {
    trackerSavesInProgress.delete(c.id);
  }
}

async function syncNeonTaskProgress() {

      result.matches.length !== S.clients.length
    ) {

        `/db/records/${match.databaseId}/task_progress`

      if (!Array.isArray(records)) {
        throw new Error(
          'Invalid progress records: ' + match.databaseName

      for (const record of records) {

        if (
          !data ||
          typeof data.taskKey !== 'string' ||
          !data.progress ||
          typeof data.progress !== 'object' ||
          Array.isArray(data.progress)

    );

    return null;
  }

async function saveNeonTaskProgress(taskKey, progress) {
  const task = identifyTask(taskKey);

  if (taskSavesInProgress.has(taskKey)) {
    throw new Error('Task save already running.');
  }

  taskSavesInProgress.add(taskKey);

  try {
    const result = await checkNeonClients();

    if (!result || result.unmatched.length !== 0) {
      throw new Error('Unable to verify database clients.');
    }

    const match = result.matches.find(
      item => item.dashboardId === task.clientId
    );

    if (!match) {
      throw new Error('Database client not found.');
    }

    const path =
      `/db/records/${match.databaseId}/task_progress`;

    const records = await api(path);

    if (!Array.isArray(records)) {
      throw new Error('Invalid task progress response.');
    }

    // Prevent duplicate progress records for this task.
    const existing = records.filter(
      record => record.data?.taskKey === taskKey
    );

    if (existing.length > 1) {
      throw new Error('Duplicate task progress records.');
    }

    const nextData = {
      taskKey,
      week: task.week,
      dashboardClientId: task.clientId,
      weekday: task.weekday,
      taskIndex: task.taskIndex,
      progress: structuredClone(progress)
    };

    if (existing.length === 1) {
      const record = existing[0];

      const updated = await api(
        `${path}/${record.id}`,
        {
          method: 'PUT',
          body: JSON.stringify({
            expectedData: record.data,
            data: nextData
          })
        }
      );

      if (!updated?.id) {
        throw new Error('Task update not confirmed.');
      }
    } else {
      const created = await api(path, {
        method: 'POST',
        body: JSON.stringify({ data: nextData })
      });

      if (!created?.id) {
        throw new Error('Task insert not confirmed.');
      }
    }

    console.log(
      'Task progress saved to Neon:',
      taskKey
    );

    return true;

  } finally {
    taskSavesInProgress.delete(taskKey);
  }
}

function identifyTask(taskKey) {
  if (typeof taskKey !== 'string') {
    throw new Error('Invalid task key.');
  }

  const parts = taskKey.split('|');

  if (parts.length !== 4) {
    throw new Error('Unexpected task key format.');
  }

  const [week, clientId, weekdayText, indexText] = parts;
  const weekday = Number(weekdayText);
  const taskIndex = Number(indexText);

  const matchedClient = S.clients.find(
    c => c.id === clientId
  );

  if (
    !matchedClient ||
    !/^\d{4}-\d{2}-\d{2}$/.test(week) ||
    !Number.isInteger(weekday) ||
    weekday < 0 ||
    weekday > 4 ||
    !Number.isInteger(taskIndex) ||
    taskIndex < 0
  ) {
    throw new Error('Task identification failed.');
  }

  return {
    key: taskKey,
    week,
    clientId,
    clientName: matchedClient.name,
    weekday,
    taskIndex
  };
}
