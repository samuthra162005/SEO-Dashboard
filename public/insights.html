<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanavu Insights</title>
<style>
:root{--bg:#ebe8ff;--grid:#d9d4fa;--card:#fff;--tx:#25134d;--mu:#675b8c;--bd:#ddd8f7;--ac:#5b2bb5;--soft:#f3f0ff;--ok:#16794f;--wa:#b86e00;--no:#c0302a;--c1:#7c4dff;--c2:#2f9e8f;--c3:#f08a2c;--c4:#3b82f6;--c5:#e05d8e;--c6:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f0d1a;--grid:#1b1731;--card:#191531;--tx:#f1eeff;--mu:#a59ccb;--bd:#2d2850;--ac:#9b7bff;--soft:#231e42;--ok:#4ade80;--wa:#fbbf24;--no:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--tx);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
.w{max-width:1200px;margin:auto;padding:14px 18px 60px}h1{font-size:24px;margin:0}h3{margin:0 0 6px;font-size:16px}h4{margin:14px 0 4px;font-size:13px;color:var(--mu)}a{color:var(--ac);font-weight:600}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:7px 12px}button{cursor:pointer;font-weight:600}button:hover{background:var(--soft)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.mu,small{color:var(--mu)}small{font-size:12.5px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{background:var(--soft);color:var(--mu)}td.n,th.n{text-align:right}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.m{background:color-mix(in srgb,var(--wa) 18%,transparent);color:var(--wa)}.b{background:color-mix(in srgb,var(--no) 18%,transparent);color:var(--no)}.f{background:var(--soft);color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.kp>div{background:var(--soft);border-radius:14px;padding:10px 12px}.kp b{display:block;font-size:24px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;min-width:70px}.bar i{display:block;height:8px;border-radius:99px;background:var(--ac)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}svg{width:100%;height:auto}li{margin:3px 0}#err{color:var(--no)}
</style></head><body><div class="w">
<div class="row sp"><div><a href="/">← Back to dashboard</a><h1>Insights and blog tracker</h1></div><div class="row"><select id="pj"></select><span id="rng" class="row"></span></div></div>
<div class="tabs" id="tabs"></div><div id="err"></div><div id="app"><p class="mu">Loading…</p></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let HS={};try{HS=JSON.parse(localStorage.getItem('kanavu_hub_v1'))||{}}catch(e){}
const ST=['To do','In progress','Lead review','Client review','Approved','Published'],SEO=['Title','Meta description','Keyword','Headings','Internal links','Image alt','URL slug'];
const TABS=[['q','Search queries'],['p','Top pages'],['t','Traffic'],['l','Landing and GA4 pages'],['v','Web vitals'],['b','Blog and on-page tracker']];
const PAL=['#7c4dff','#2f9e8f','#f08a2c','#3b82f6','#e05d8e','#16a34a','#8b5cf6','#e0a21b'];
const iso=d=>d.toISOString().slice(0,10),add=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const fdate=s=>new Date(s+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
const nf=v=>v==null||isNaN(v)?'–':Math.round(v).toLocaleString('en-IN'),pc=v=>v==null?'–':(v*100).toFixed(2)+'%',ps=v=>v==null?'–':v.toFixed(1);
let P=[],cur='',tab='q',from='',to='',sortK='clicks';
async function api(p,q){const r=await fetch('/api'+p+'?'+new URLSearchParams(q||{}),{headers:{'x-token':HS.token||''}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error '+r.status);return j}
function grp(rows,k){const m=new Map();rows.forEach(r=>{const key=typeof k=='function'?k(r):r[k];if(!key)return;let a=m.get(key);if(!a)m.set(key,a={name:key,clicks:0,impressions:0,pw:0,pi:0,sessions:0,users:0,views:0});
 a.clicks+=r.clicks||0;a.impressions+=r.impressions||0;if(r.position!=null){a.pw+=r.position*(r.impressions||1);a.pi+=r.impressions||1}a.sessions+=r.sessions||0;a.users+=r.totalUsers||r.activeUsers||0;a.views+=r.views||0});
 return[...m.values()].map(a=>({...a,ctr:a.impressions?a.clicks/a.impressions:0,position:a.pi?a.pw/a.pi:null}))}
function tbl(cols,rows){return rows.length?`<div class="tw"><table><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${c.h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="mu">No data for these dates.</p>'}
function hbar(items,fmt){const mx=Math.max(...items.map(i=>i.v),1);return `<svg viewBox="0 0 560 ${items.length*28+8}">${items.map((x,i)=>`<text x="2" y="${i*28+19}" font-size="12" fill="var(--tx)">${E(String(x.l).slice(0,28))}</text><rect x="200" y="${i*28+6}" width="${Math.max(2,330*x.v/mx)}" height="18" rx="4" fill="${PAL[i%8]}"><title>${E(x.l)}: ${fmt(x.v)}</title></rect><text x="${205+330*x.v/mx}" y="${i*28+19}" font-size="12" fill="var(--tx)">${fmt(x.v)}</text>`).join('')}</svg>`}
function donut(items){const T=items.reduce((a,x)=>a+x.v,0)||1;let a0=-Math.PI/2;const R=80,C=100;let s=items.map((x,i)=>{const a=x.v/T*2*Math.PI,a1=a0+a,d=a>=6.28?`<circle cx="${C}" cy="${C}" r="${R}" fill="${PAL[i%8]}"/>`:`<path d="M${C},${C}L${C+R*Math.cos(a0)},${C+R*Math.sin(a0)}A${R},${R} 0 ${a>Math.PI?1:0},1 ${C+R*Math.cos(a1)},${C+R*Math.sin(a1)}Z" fill="${PAL[i%8]}"><title>${E(x.l)}: ${nf(x.v)} (${Math.round(x.v/T*100)}%)</title></path>`;a0=a1;return d}).join('');
 s+=`<circle cx="${C}" cy="${C}" r="48" fill="var(--card)"/><text x="${C}" y="${C+6}" text-anchor="middle" font-size="18" font-weight="700" fill="var(--tx)">${nf(T)}</text>`+items.slice(0,9).map((x,i)=>`<rect x="215" y="${16+i*20}" width="11" height="11" rx="2" fill="${PAL[i%8]}"/><text x="232" y="${26+i*20}" font-size="12" fill="var(--tx)">${E(String(x.l).slice(0,22))}  ${nf(x.v)} (${Math.round(x.v/T*100)}%)</text>`).join('');return `<svg viewBox="0 0 460 200">${s}</svg>`}
const top=(g,k,n)=>[...g].sort((a,b)=>b[k]-a[k]).slice(0,n);
function opps(g,what){const a=g.filter(x=>x.position>=4&&x.position<=10&&x.impressions>=10),b=g.filter(x=>x.position>10&&x.position<=20&&x.impressions>=10),c=g.filter(x=>x.position!=null&&x.position<=10&&x.impressions>=30&&x.ctr<.02);
 const li=(l)=>l.length?'<ul>'+top(l,'impressions',5).map(x=>`<li>${E(String(x.name).slice(0,70))} <small>(${nf(x.impressions)} impressions, position ${ps(x.position)}, CTR ${pc(x.ctr)})</small></li>`).join('')+'</ul>':'<p class="mu">None found.</p>';
 return `<div class="card"><h3>Where to improve next</h3><div class="grid"><div><h4>Almost there: ranks 4 to 10</h4><small>A small boost (better content, internal links) can move these to the top 3.</small>${li(a)}</div><div><h4>Page 2: ranks 11 to 20</h4><small>Refresh the ${what} and add links to move these to page 1.</small>${li(b)}</div><div><h4>Seen but not clicked</h4><small>Top 10 but CTR under 2%. Rewrite the title and meta description.</small>${li(c)}</div></div></div>`}
async function vq(){const r=await api('/detail/queries',{project:cur,from,to}),g=grp(r.rows,'query'),t=top(g,'clicks',10);
 return `<div class="kp"><div><small>Queries</small><b>${nf(g.length)}</b></div><div><small>Clicks</small><b>${nf(g.reduce((a,x)=>a+x.clicks,0))}</b></div><div><small>Impressions</small><b>${nf(g.reduce((a,x)=>a+x.impressions,0))}</b></div></div>`+
 `<div class="card" style="margin-top:12px"><h3>Top 10 queries by clicks</h3>${t.length?hbar(t.map(x=>({l:x.name,v:x.clicks})),nf):'<p class="mu">'+E(r.note||'No data')+'</p>'}</div>`+opps(g,'pages')+
 `<div class="card"><div class="row sp"><h3>All queries</h3><label>Sort <select id="sk">${[['clicks','Most clicks'],['impressions','Most impressions'],['position','Best position']].map(([k,l])=>`<option value="${k}" ${k==sortK?'selected':''}>${l}</option>`).join('')}</select></label></div>`+
 tbl([{h:'Query',f:x=>E(x.name)},{h:'Clicks',n:1,f:x=>nf(x.clicks)},{h:'Impressions',n:1,f:x=>nf(x.impressions)},{h:'CTR',n:1,f:x=>pc(x.ctr)},{h:'Position',n:1,f:x=>ps(x.position)}],[...g].sort((a,b)=>sortK=='position'?(a.position??99)-(b.position??99):b[sortK]-a[sortK]).slice(0,100))+'</div>'}
async function vp(){const r=await api('/detail/pages',{project:cur,from,to}),g=grp(r.rows,'page'),t=top(g,'clicks',10);
 return `<div class="card"><h3>Top 10 pages by clicks</h3>${t.length?hbar(t.map(x=>({l:x.name.replace(/^https?:\/\/[^/]+/,'')||'/',v:x.clicks})),nf):'<p class="mu">'+E(r.note||'No data')+'</p>'}</div>`+opps(g,'pages')+
 `<div class="card"><h3>All pages</h3>`+tbl([{h:'Page',f:x=>`<a href="${E(x.name)}" target="_blank" rel="noopener">${E(x.name.replace(/^https?:\/\/(www\.)?/,'').slice(0,70))}</a>`},{h:'Clicks',n:1,f:x=>nf(x.clicks)},{h:'Impressions',n:1,f:x=>nf(x.impressions)},{h:'CTR',n:1,f:x=>pc(x.ctr)},{h:'Position',n:1,f:x=>ps(x.position)}],top(g,'clicks',100))+'</div>'}
async function vt(){const r=await api('/detail/channels',{project:cur,from,to}),g=top(grp(r.rows,'channel'),'sessions',12),T=g.reduce((a,x)=>a+x.sessions,0)||1;
 return `<div class="card"><h3>Traffic by channel (GA4 sessions)</h3>${g.length?`<div class="grid"><div>${donut(g.map(x=>({l:x.name,v:x.sessions})))}</div><div>`+tbl([{h:'Channel',f:x=>E(x.name)},{h:'Sessions',n:1,f:x=>nf(x.sessions)},{h:'Share',n:1,f:x=>Math.round(x.sessions/T*100)+'%'},{h:'Users',n:1,f:x=>nf(x.users)}],g)+'</div></div>':'<p class="mu">'+E(r.note||'No GA4 data yet. Add the GA4 property ID in Code.gs and run the collector.')+'</p>'}</div>`}
async function vl(){const [a,b]=await Promise.all([api('/detail/landing',{project:cur,from,to}),api('/detail/ga4pages',{project:cur,from,to})]);
 return `<div class="card"><h3>Landing pages (where visitors arrive)</h3>`+(a.rows.length?tbl([{h:'Landing page',f:x=>E(x.name)},{h:'Sessions',n:1,f:x=>nf(x.sessions)},{h:'Users',n:1,f:x=>nf(x.users)}],top(grp(a.rows,'landingPage'),'sessions',50)):'<p class="mu">'+E(a.note||'No data')+'</p>')+`</div><div class="card"><h3>Pages people viewed (GA4)</h3>`+tbl([{h:'Page title',f:x=>E(x.name.split(' | ')[0].slice(0,70))},{h:'Path',f:x=>E((x.name.split(' | ')[1]||'').slice(0,60))},{h:'Views',n:1,f:x=>nf(x.views)},{h:'Users',n:1,f:x=>nf(x.users)}],top(grp(b.rows.map(r=>({...r,key:r.title+' | '+r.path})),'key'),'views',50))+'</div>'}
const chip=(v,g,p)=>v==null?'<span class="chip f">n/a</span>':`<span class="chip ${v<=g?'g':v<=p?'m':'b'}">${v<=g?'Good':v<=p?'Needs work':'Poor'}</span>`;
function vv(){let V={};try{V=JSON.parse(localStorage.getItem('kanavu_vitals')||'{}')}catch(e){}
 return `<div class="card"><h3>Core Web Vitals (Google PageSpeed, mobile)</h3><p class="mu">Press Check to test the live website. Each test takes about 20 seconds. Targets: LCP 2.5s or less, INP 200ms or less, CLS 0.1 or less, score 90 or more.</p>`+
 tbl([{h:'Project',f:x=>'<b>'+E(x.label||x.name)+'</b>'},{h:'Website',f:x=>`<a href="${E(x.website)}" target="_blank" rel="noopener">${E(x.website.replace(/^https?:\/\/(www\.)?/,''))}</a>`},
 {h:'Score',n:1,f:x=>{const r=V[x.name];return r?`${r.score} <span class="chip ${r.score>=90?'g':r.score>=50?'m':'b'}">${r.score>=90?'Good':r.score>=50?'Needs work':'Poor'}</span>`:'–'}},
 {h:'LCP',n:1,f:x=>{const r=V[x.name];return r?r.lcp.toFixed(1)+'s '+chip(r.lcp,2.5,4):'–'}},
 {h:'INP / TBT',n:1,f:x=>{const r=V[x.name];return r?(r.inp!=null?r.inp+'ms '+chip(r.inp,200,500):Math.round(r.tbt)+'ms TBT '+chip(r.tbt,200,600)):'–'}},
 {h:'CLS',n:1,f:x=>{const r=V[x.name];return r?r.cls.toFixed(3)+' '+chip(r.cls,.1,.25):'–'}},
 {h:'Last checked',f:x=>V[x.name]?fdate(V[x.name].at.slice(0,10)):'Never'},{h:'',f:x=>`<button data-vt="${E(x.name)}">Check</button>`}],P)+'</div>'}
function vb(){const c=HS.clients||[],tasks=HS.tasks||{},rows=[];
 Object.entries(tasks).forEach(([k,it])=>{const [w,id,wd,i]=k.split('|'),cl=c.find(x=>x.id==id);if(!cl)return;const kind=(cl.sched&&cl.sched[wd]||[])[+i];if(kind!='Blog')return;
  rows.push({date:add(w,+wd),client:cl.name,title:it.title||'',st:it.st||0,seo:(it.seo||[]).filter(Boolean).length,lead:it.t&&it.t[2]&&it.t[3]?new Date(it.t[3])-new Date(it.t[2]):null,cli:it.t&&it.t[3]&&it.t[4]?new Date(it.t[4])-new Date(it.t[3]):null})});
 rows.sort((a,b)=>b.date.localeCompare(a.date));const fc=bf.c,fs=bf.s,fm=bf.m;
 const months=[...new Set(rows.map(r=>r.date.slice(0,7)))],L=rows.filter(r=>(!fc||r.client==fc)&&(fs===''||r.st==fs)&&(!fm||r.date.startsWith(fm)));
 const dur=ms=>ms==null?'–':ms<36e5*48?Math.round(ms/36e5)+'h':Math.round(ms/864e5)+'d',by={};rows.forEach(r=>by[r.client]=(by[r.client]||0)+1);
 const done=L.filter(r=>r.st>=4).length,avg=L.length?L.reduce((a,r)=>a+r.seo,0)/L.length:0;
 return `<div class="kp"><div><small>Blogs shown</small><b>${L.length}</b></div><div><small>Approved or published</small><b>${done}</b></div><div><small>Still in progress</small><b>${L.length-done}</b></div><div><small>Avg on-page SEO</small><b>${avg.toFixed(1)}/7</b></div></div>
 <div class="card" style="margin-top:12px"><div class="row"><select id="bc"><option value="">All clients</option>${Object.keys(by).map(n=>`<option ${n==fc?'selected':''}>${E(n)}</option>`).join('')}</select><select id="bs"><option value="">Any status</option>${ST.map((s,i)=>`<option value="${i}" ${fs!==''&&i==fs?'selected':''}>${s}</option>`).join('')}</select><select id="bm"><option value="">All months</option>${months.map(m=>`<option value="${m}" ${m==fm?'selected':''}>${new Date(m+'-15T12:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</option>`).join('')}</select></div></div>
 <div class="card"><h3>Blogs by status</h3>${L.length?hbar(ST.map((s,i)=>({l:s,v:L.filter(r=>r.st==i).length})),nf):'<p class="mu">Nothing yet.</p>'}</div>
 <div class="card"><h3>Every blog</h3>${tbl([{h:'Date',f:r=>E(fdate(r.date))},{h:'Client',f:r=>'<b>'+E(r.client)+'</b>'},{h:'Title',f:r=>E(r.title||'(no title yet)')},{h:'Status',f:r=>`<span class="chip ${r.st>=4?'g':r.st>=2?'m':'f'}">${ST[r.st]}</span>`},{h:'On-page SEO',f:r=>`<div class="row"><div class="bar"><i style="width:${r.seo/7*100}%"></i></div>${r.seo}/7</div>`},{h:'With lead',n:1,f:r=>dur(r.lead)},{h:'With client',n:1,f:r=>dur(r.cli)}],L)}<small>This list comes from the Tracker in your dashboard. Tick the 7 on-page SEO items on each blog there, and they count here.</small></div>`}
const bf={c:'',s:'',m:''};
async function show(){$('#err').textContent='';$('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${k==tab?'on':''}">${l}</button>`).join('');
 $('#rng').innerHTML=tab=='v'||tab=='b'?'':`<input type="date" id="df" value="${from}"><input type="date" id="dt" value="${to}"><button data-r="7">7d</button><button data-r="28">28d</button><button data-r="90">90d</button>`;
 $('#app').innerHTML='<p class="mu">Loading…</p>';
 try{$('#app').innerHTML=await({q:vq,p:vp,t:vt,l:vl,v:vv,b:vb}[tab])()}catch(e){$('#app').innerHTML='';$('#err').textContent='Error: '+e.message}}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;show()}else if(t.dataset.r){to=$('#dt').value||to;from=add(to,-(+t.dataset.r-1));show()}
 else if(t.dataset.vt){t.disabled=true;t.textContent='Testing…';try{const r=await api('/vitals',{url:P.find(p=>p.name==t.dataset.vt).website});r.at=new Date().toISOString();const V=JSON.parse(localStorage.getItem('kanavu_vitals')||'{}');V[t.dataset.vt]=r;localStorage.setItem('kanavu_vitals',JSON.stringify(V))}catch(x){$('#err').textContent='Web vitals error: '+x.message}show()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='pj'){cur=t.value;show()}else if(t.id=='df'||t.id=='dt'){from=$('#df').value;to=$('#dt').value;if(from&&to&&from<=to)show()}else if(t.id=='sk'){sortK=t.value;show()}else if(t.id=='bc'){bf.c=t.value;show()}else if(t.id=='bs'){bf.s=t.value;show()}else if(t.id=='bm'){bf.m=t.value;show()}});
(async()=>{if(!HS.user){$('#app').innerHTML='<div class="card">Please <a href="/">sign in to the dashboard</a> first, then open this page again.</div>';return}
 try{P=await api('/projects');const st=await api('/status');cur=P[0].name;to=st.lastDate||add(iso(new Date()),-3);from=add(to,-27);$('#pj').innerHTML=P.map(p=>`<option value="${E(p.name)}">${E(p.label||p.name)}</option>`).join('');show()}
 catch(e){$('#app').innerHTML='';$('#err').textContent='Cannot reach the server: '+e.message+'. Start it with npm start and open http://localhost:3000/insights.html'}})();
</script></body></html>
